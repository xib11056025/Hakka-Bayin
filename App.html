<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鬧(Now)打八音 APP</title>
    
    <!-- 引入 Tailwind CSS 進行版面佈局與樣式設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Lucide Icons 圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 自訂動畫效果 */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 隱藏元素 */
        .hidden-tab { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex justify-center min-h-screen">
        <div class="w-full max-w-md bg-white shadow-xl flex flex-col h-screen overflow-hidden">
            
            <!-- Header -->
            <header class="bg-red-700 text-white p-4 shadow-md flex items-center justify-center relative z-10">
                <h1 class="text-2xl font-bold tracking-widest">鬧(Now)打八音</h1>
            </header>

            <!-- Main Content Area -->
            <main class="flex-1 overflow-y-auto bg-[#faf8f5] relative" id="main-content">
                
                <!-- 1. 八音介紹 Tab -->
                <div id="tab-intro" class="p-4 space-y-6 fade-in hidden-tab">
                    <section class="bg-white p-5 rounded-2xl shadow-sm border border-orange-100">
                        <h2 class="text-xl font-bold text-red-800 mb-3 flex items-center">
                            <i data-lucide="info" class="mr-2 w-5 h-5"></i>客家八音是什麼？
                        </h2>
                        <p class="text-gray-700 leading-relaxed text-sm">
                            「八音」原指金、石、絲、竹、匏、土、革、木等八種製作樂器的材料。客家八音是客家人在長期的歷史遷徙中，吸收各地民間音樂精華，結合自身語言特色所發展出的獨特器樂合奏。無論是迎神賽會、婚喪喜慶，都能聽到這熱鬧（鬧熱）的聲音。
                        </p>
                    </section>

                    <section>
                        <h2 class="text-xl font-bold text-red-800 mb-4 px-1">核心樂器介紹</h2>
                        <div id="instruments-container" class="grid grid-cols-2 gap-3">
                            <!-- 樂器資料將透過 JS 渲染 -->
                        </div>
                    </section>
                    
                    <div id="copyright-intro"></div>
                </div>

                <!-- 2. 影音欣賞 Tab -->
                <div id="tab-media" class="p-4 space-y-5 fade-in hidden-tab">
                    <div class="bg-red-50 p-4 rounded-xl mb-4">
                        <h2 class="text-lg font-bold text-red-800 mb-1">影音欣賞</h2>
                        <p class="text-sm text-red-600">匯集大夥房藝術團、林作長老師等珍貴影音資料，帶您身歷其境。</p>
                    </div>
                    
                    <div id="videos-container" class="space-y-5">
                        <!-- 影音資料將透過 JS 渲染 -->
                    </div>

                    <div id="copyright-media"></div>
                </div>

                <!-- 3. 八音達人 Tab -->
                <div id="tab-master" class="h-full flex flex-col fade-in hidden-tab">
                    <div class="flex bg-white shadow-sm shrink-0">
                        <button onclick="switchMasterSubTab('quiz')" id="subtab-quiz-btn" class="flex-1 py-3 text-sm font-bold border-b-2 border-red-600 text-red-600 transition-colors">知識小測驗</button>
                        <button onclick="switchMasterSubTab('game')" id="subtab-game-btn" class="flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-gray-500 transition-colors">音樂拼接遊戲</button>
                    </div>

                    <div class="flex-1 overflow-y-auto relative">
                        <!-- 知識測驗區塊 -->
                        <div id="subtab-quiz" class="h-full"></div>
                        <!-- 音樂遊戲區塊 -->
                        <div id="subtab-game" class="hidden-tab h-full p-5 flex flex-col items-center">
                            <div class="mb-6 text-center">
                                <h2 class="text-xl font-bold text-gray-800 mb-2">簡易音樂拼接</h2>
                                <p class="text-xs text-gray-500">點擊格子創造你的八音旋律，然後按下播放！</p>
                            </div>
                            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-6 w-full max-w-[300px]">
                                <div id="music-grid" class="grid gap-2" style="grid-template-columns: repeat(5, minmax(0, 1fr))">
                                    <!-- 網格將由 JS 渲染 -->
                                </div>
                            </div>
                            <div class="flex gap-4">
                                <button id="play-music-btn" onclick="toggleMusicPlay()" class="px-8 py-3 rounded-full font-bold flex items-center text-white bg-green-500">
                                    <i data-lucide="play" class="mr-2 w-5 h-5"></i> 播放
                                </button>
                                <button onclick="clearMusicGrid()" class="px-6 py-3 rounded-full font-bold flex items-center bg-gray-200 text-gray-700 hover:bg-gray-300">
                                    <i data-lucide="refresh-cw" class="mr-2 w-5 h-5"></i> 清除
                                </button>
                            </div>
                            <div class="mt-8 text-xs text-gray-400">素材概念參考: Chrome Music Lab</div>
                        </div>
                    </div>
                </div>

            </main>

            <!-- Bottom Navigation -->
            <nav class="bg-white border-t border-gray-200 flex justify-around p-2 pb-6 z-10 shrink-0">
                <button onclick="switchTab('intro')" id="nav-intro" class="flex flex-col items-center justify-center p-2 w-full text-red-700 transition-colors">
                    <i data-lucide="book-open"></i>
                    <span class="text-xs mt-1 font-medium">八音介紹</span>
                </button>
                <button onclick="switchTab('media')" id="nav-media" class="flex flex-col items-center justify-center p-2 w-full text-gray-400 hover:text-red-500 transition-colors">
                    <i data-lucide="video"></i>
                    <span class="text-xs mt-1 font-medium">影音欣賞</span>
                </button>
                <button onclick="switchTab('master')" id="nav-master" class="flex flex-col items-center justify-center p-2 w-full text-gray-400 hover:text-red-500 transition-colors">
                    <i data-lucide="award"></i>
                    <span class="text-xs mt-1 font-medium">八音達人</span>
                </button>
            </nav>

        </div>
    </div>

    <!-- 應用程式邏輯 (JavaScript) -->
    <script>
        // --- 資料庫 ---
        const instruments = [
            { id: 1, name: '嗩吶', type: '管樂', desc: '客家八音的靈魂與主奏樂器，音色高亢明亮，常擔任「頭手」帶領樂團。', img: 'https://www.hakka-portal.ntpc.gov.tw/archive/article/8/normal/part_623_4412158_94710.jpg' },
            { id: 2, name: '胖胡 (大廣弦)', type: '擦弦', desc: '音色低沉渾厚，共鳴箱較大，是八音絃索音樂中重要的伴奏樂器。', img: 'https://images.unsplash.com/photo-1621516246062-8e72750a97c9?w=500&q=80' },
            { id: 3, name: '揚琴', type: '擊弦', desc: '音色清脆如珠落玉盤，能在合奏中發揮融合與豐富和聲的作用。', img: 'https://images.unsplash.com/photo-1542704792-e30dac463c90?w=500&q=80' },
            { id: 4, name: '堂鼓與銅器', type: '打擊', desc: '包含堂鼓、小鈸、大鑼等，是控制樂曲節奏與氣氛的骨幹。', img: 'https://images.unsplash.com/photo-1519892300165-cb5542fb47c7?w=500&q=80' }
        ];

        const videos = [
            { id: 'v1', title: '客家八音基礎認識', source: '大夥房藝術團', type: 'youtube', url: 'https://drive.google.com/file/d/1YUZ0QmpopWwVPPmC-mI88qD7XBAeweV7/preview', ytUrl: 'https://drive.google.com/file/d/1YUZ0QmpopWwVPPmC-mI88qD7XBAeweV7/view?usp=drive_link' }, 
            { id: 'v2', title: '傳統吹場音樂欣賞', source: '六堆八音傳藝', type: 'youtube', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', ytUrl: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' },
            { id: 'v3', title: '林作長老師 - 八音示範', source: '雲端影音', type: 'youtube', url: 'https://www.youtube.com/embed/acNuUWgdl5Q', ytUrl: 'https://www.youtube.com/watch?v=acNuUWgdl5Q' }
        ];

        const quizQuestions = [
            { q: "客家八音中的「八音」原指什麼？", options: ["八種不同的樂器", "金、石、絲、竹、匏、土、革、木等八種製作樂器的材料", "八個不同的音階", "八種客家傳統曲調"], ans: 1 },
            { q: "傳統客家八音演奏形式主要分為哪兩種？", options: ["吹場音樂、絃索音樂", "獨奏、合奏", "文場、武場", "山歌、採茶戲"], ans: 0 },
            { q: "下列哪一種樂器不屬於客家八音常用的樂器？", options: ["嗩吶", "胖胡 (大廣弦)", "鋼琴", "堂鼓"], ans: 2 },
            { q: "客家八音中，常擔任主旋律帶領樂團的「頭手」主要演奏哪種樂器？", options: ["揚琴", "椰胡", "嗩吶", "小鈸"], ans: 2 },
            { q: "在客家人的生命禮俗中，哪個場合最常聽到客家八音？", options: ["婚喪喜慶及廟會慶典", "學校升旗典禮", "睡前搖籃曲", "流行音樂演唱會"], ans: 0 },
            { q: "「六堆」地區的客家八音發展具有地方特色，請問「六堆」位於台灣的哪個區域？", options: ["桃竹苗地區", "高屏地區", "花東地區", "雲嘉南地區"], ans: 1 },
            { q: "胖胡（大廣弦）在客家八音中屬於哪一類樂器？", options: ["吹管樂器", "打擊樂器", "撥弦樂器", "擦弦樂器 (絲)"], ans: 3 },
            { q: "台灣客家八音常用的打擊樂器（敲擊）中，通常不包含下列何者？", options: ["堂鼓", "爵士鼓", "小鈸", "大鑼"], ans: 1 },
            { q: "「吹場音樂」通常在什麼時候演奏？", options: ["迎神、祭祀等莊嚴熱鬧場合", "室內喝茶聊天時", "歌仔戲伴奏時", "現代舞蹈表演中"], ans: 0 },
            { q: "學習客家八音最傳統的方式通常是透過何種途徑？", options: ["出國留學", "口傳心授與家族/師徒傳承", "線上購買函授課程", "看樂譜自學"], ans: 1 }
        ];

        // --- 全域變數狀態 ---
        let localVideoSrc = null;
        let videoError = false;

        // 測驗狀態
        let currentQ = 0;
        let score = 0;
        let showResult = false;
        let selectedOpt = null;
        let isAnswered = false;

        // 音樂拼接遊戲狀態
        const rows = 5;
        const cols = 5;
        let grid = Array(rows).fill().map(() => Array(cols).fill(false));
        let isPlaying = false;
        let currentCol = 0;
        let musicInterval;
        const notes = [880, 783.99, 659.25, 587.33, 523.25]; // A5, G5, E5, D5, C5

        // --- 發聲輔助函式 ---
        const playTone = (frequency, type = 'sine') => {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = frequency;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
            osc.stop(ctx.currentTime + 0.5);
        };

        // --- UI 更新與渲染函式 ---

        // 產生版權宣告區塊
        const getCopyrightHTML = () => `
            <div class="mt-8 mb-4 p-4 border-t border-gray-200 text-xs text-gray-400 text-center leading-relaxed">
                <p class="font-bold mb-1">版權聲明</p>
                <p>本APP為課堂教學使用，無商業用途。</p>
                <p>部分內容取材自吳榮順期刊文章、六堆八音傳藝雜誌、新北市客家文化典藏資料庫、大夥房藝術團等公開網路、紙本出版品或網站，版權屬原作者所有。</p>
            </div>
        `;

        // 初始化八音介紹
        function initIntro() {
            const container = document.getElementById('instruments-container');
            container.innerHTML = instruments.map(inst => `
                <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100 flex flex-col">
                    <div class="h-28 bg-gray-200 relative">
                        <img src="${inst.img}" alt="${inst.name}" class="w-full h-full object-cover mix-blend-multiply" />
                        <span class="absolute top-2 right-2 bg-black/50 text-white text-xs px-2 py-1 rounded-full">${inst.type}</span>
                    </div>
                    <div class="p-3 flex-1 flex flex-col">
                        <h3 class="font-bold text-gray-800 mb-1">${inst.name}</h3>
                        <p class="text-xs text-gray-500 line-clamp-3">${inst.desc}</p>
                        <button onclick="playTone(${inst.id * 200 + 300}, 'square')" class="mt-auto pt-2 text-red-600 flex items-center text-xs font-bold hover:text-red-800">
                            <i data-lucide="play" class="mr-1 w-3.5 h-3.5"></i> 試聽音色
                        </button>
                    </div>
                </div>
            `).join('');
            document.getElementById('copyright-intro').innerHTML = getCopyrightHTML();
            lucide.createIcons();
        }

        // 初始化影音欣賞
        function renderMedia() {
            const container = document.getElementById('videos-container');
            let html = '';
            
            videos.forEach(video => {
                let videoPlayerHtml = '';
                
                if (video.type === 'youtube') {
                    videoPlayerHtml = `
                        <iframe 
                            class="absolute top-0 left-0 w-full h-full"
                            src="${video.url}" 
                            title="${video.title}"
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen>
                        </iframe>
                    `;
                } else if (video.type === 'local') {
                    if (localVideoSrc || !videoError) {
                        videoPlayerHtml = `
                            <video 
                                class="absolute top-0 left-0 w-full h-full object-contain bg-black"
                                src="${localVideoSrc || video.url}" 
                                controls
                                ${localVideoSrc ? 'autoplay' : ''}
                                onerror="handleVideoError(this)"
                            ></video>
                        `;
                    } else {
                        videoPlayerHtml = `
                            <div class="absolute top-0 left-0 w-full h-full flex flex-col items-center justify-center bg-gray-800 text-white p-4 text-center">
                                <p class="text-sm text-gray-300 mb-4">請手動選擇您剛才上傳的影片檔案</p>
                                <label class="cursor-pointer bg-red-600 hover:bg-red-700 px-5 py-2 rounded-full text-sm font-bold flex items-center transition-colors">
                                    <i data-lucide="upload" class="mr-2 w-4 h-4"></i> 選擇本機影片
                                    <input type="file" accept="video/*" class="hidden" onchange="handleFileUpload(event)" />
                                </label>
                            </div>
                        `;
                    }
                }

                let fallbackBtn = '';
                if (video.type === 'youtube' && video.ytUrl) {
                    fallbackBtn = `
                        <a href="${video.ytUrl}" target="_blank" rel="noopener noreferrer" class="text-xs text-red-600 font-bold hover:text-red-800 bg-red-50 px-3 py-1 rounded-full border border-red-100 transition-colors">
                            無法播放？點此觀看
                        </a>
                    `;
                } else if (video.type === 'local' && localVideoSrc) {
                    fallbackBtn = `
                        <button onclick="resetLocalVideo()" class="text-xs text-gray-500 font-bold hover:text-gray-700 underline">
                            重新選擇影片
                        </button>
                    `;
                }

                html += `
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                        <div class="aspect-video bg-gray-900 w-full relative">
                            ${videoPlayerHtml}
                        </div>
                        <div class="p-4 flex flex-col space-y-2">
                            <h3 class="font-bold text-gray-800">${video.title}</h3>
                            <div class="flex justify-between items-center">
                                <span class="inline-block bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded">來源: ${video.source}</span>
                                ${fallbackBtn}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('copyright-media').innerHTML = getCopyrightHTML();
            lucide.createIcons();
        }

        // 處理影片錯誤
        window.handleVideoError = function(el) {
            if (!localVideoSrc) {
                videoError = true;
                renderMedia();
            }
        };

        // 處理本地影片上傳
        window.handleFileUpload = function(e) {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                localVideoSrc = url;
                videoError = false;
                renderMedia();
            }
        };

        // 重置本地影片
        window.resetLocalVideo = function() {
            localVideoSrc = null;
            videoError = true;
            renderMedia();
        };

        // 渲染知識測驗
        function renderQuiz() {
            const container = document.getElementById('subtab-quiz');
            
            if (showResult) {
                let resultTitle = "", resultDesc = "", resultColor = "";
                if (score === 100) { resultTitle = "八音大神！"; resultDesc = "太神啦！你對客家八音的了解無人能敵！"; resultColor = "text-yellow-500"; }
                else if (score >= 90) { resultTitle = "八音名家"; resultDesc = "非常厲害！你已經是八音領域的專家了！"; resultColor = "text-orange-500"; }
                else if (score >= 80) { resultTitle = "八音高手"; resultDesc = "實力堅強！對八音有很深的認識喔！"; resultColor = "text-red-500"; }
                else if (score >= 70) { resultTitle = "八音好手"; resultDesc = "表現不錯！繼續探索更多八音的奧秘吧！"; resultColor = "text-blue-500"; }
                else if (score >= 60) { resultTitle = "八音達人(入門)"; resultDesc = "過關囉！具備基本的八音知識了！"; resultColor = "text-green-500"; }
                else { resultTitle = "八音新手"; resultDesc = "再接再厲！多看幾次介紹一定能拿高分！"; resultColor = "text-gray-600"; }

                container.innerHTML = `
                    <div class="p-6 flex flex-col items-center justify-center min-h-[70vh] text-center fade-in">
                        <i data-lucide="award" class="w-20 h-20 ${resultColor} mb-4"></i>
                        <h2 class="text-4xl font-black mb-2">${score} 分</h2>
                        <h3 class="text-2xl font-bold mb-2 ${resultColor}">${resultTitle}</h3>
                        <p class="text-gray-600 mb-8">${resultDesc}</p>
                        <button onclick="resetQuiz()" class="bg-red-600 text-white px-8 py-3 rounded-full font-bold flex items-center hover:bg-red-700 active:scale-95 transition-transform">
                            <i data-lucide="refresh-cw" class="mr-2 w-5 h-5"></i> 再玩一次
                        </button>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const q = quizQuestions[currentQ];
            let optionsHtml = '';
            
            q.options.forEach((opt, idx) => {
                let btnClass = "w-full text-left p-4 rounded-xl border-2 font-medium transition-all ";
                let iconHtml = "";

                if (!isAnswered) {
                    btnClass += "border-gray-200 hover:border-red-300 bg-white text-gray-700 active:bg-gray-50";
                } else {
                    if (idx === q.ans) {
                        btnClass += "border-green-500 bg-green-50 text-green-700";
                        iconHtml = `<i data-lucide="check-circle" class="w-5 h-5 text-green-500"></i>`;
                    } else if (idx === selectedOpt) {
                        btnClass += "border-red-500 bg-red-50 text-red-700";
                        iconHtml = `<i data-lucide="x-circle" class="w-5 h-5 text-red-500"></i>`;
                    } else {
                        btnClass += "border-gray-200 bg-white opacity-50";
                    }
                }

                optionsHtml += `
                    <button onclick="handleQuizAnswer(${idx})" class="${btnClass}" ${isAnswered ? 'disabled' : ''}>
                        <div class="flex justify-between items-center">
                            <span>${opt}</span>
                            ${iconHtml}
                        </div>
                    </button>
                `;
            });

            container.innerHTML = `
                <div class="p-5 fade-in">
                    <div class="flex justify-between items-center mb-6 text-sm font-bold text-gray-500">
                        <span>題目 ${currentQ + 1} / 10</span>
                        <span class="text-red-600">目前分數: ${score}</span>
                    </div>
                    
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6 min-h-[120px] flex items-center">
                        <h3 class="text-lg font-bold text-gray-800 leading-relaxed">${q.q}</h3>
                    </div>

                    <div class="space-y-3">
                        ${optionsHtml}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // 處理測驗作答
        window.handleQuizAnswer = function(idx) {
            if (isAnswered) return;
            selectedOpt = idx;
            isAnswered = true;
            
            if (idx === quizQuestions[currentQ].ans) {
                score += 10;
            }

            renderQuiz(); // 顯示正確/錯誤狀態

            setTimeout(() => {
                if (currentQ < quizQuestions.length - 1) {
                    currentQ++;
                    selectedOpt = null;
                    isAnswered = false;
                    renderQuiz();
                } else {
                    showResult = true;
                    renderQuiz();
                }
            }, 1200);
        };

        // 重置測驗
        window.resetQuiz = function() {
            currentQ = 0;
            score = 0;
            showResult = false;
            selectedOpt = null;
            isAnswered = false;
            renderQuiz();
        };

        // 渲染音樂網格
        function renderMusicGrid() {
            const container = document.getElementById('music-grid');
            let html = '';
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const isActive = grid[r][c];
                    const isHighlight = c === currentCol && isPlaying;
                    
                    let classes = "w-12 h-12 rounded-lg transition-all ";
                    classes += isActive ? "bg-orange-500 shadow-inner " : "bg-orange-50 hover:bg-orange-100 ";
                    classes += isHighlight ? "ring-4 ring-red-400 ring-opacity-50 transform scale-110 " : "";

                    html += `<button onclick="toggleMusicCell(${r}, ${c})" class="${classes}"></button>`;
                }
            }
            container.innerHTML = html;
        }

        // 切換音樂網格點擊
        window.toggleMusicCell = function(r, c) {
            grid[r][c] = !grid[r][c];
            if(grid[r][c]) playTone(notes[r], 'triangle');
            renderMusicGrid();
        };

        // 播放/停止 音樂遊戲
        window.toggleMusicPlay = function() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('play-music-btn');
            
            if (isPlaying) {
                // UI 改變為停止
                btn.className = "px-8 py-3 rounded-full font-bold flex items-center text-white bg-red-500";
                btn.innerHTML = `<i data-lucide="x-circle" class="mr-2 w-5 h-5"></i> 停止`;
                lucide.createIcons();

                // 播放第一拍
                grid.forEach((row, rIdx) => {
                    if (row[0]) playTone(notes[rIdx], 'triangle');
                });
                renderMusicGrid();

                musicInterval = setInterval(() => {
                    currentCol = (currentCol + 1) % cols;
                    grid.forEach((row, rIdx) => {
                        if (row[currentCol]) playTone(notes[rIdx], 'triangle');
                    });
                    renderMusicGrid();
                }, 400);

            } else {
                // UI 改變為播放
                btn.className = "px-8 py-3 rounded-full font-bold flex items-center text-white bg-green-500";
                btn.innerHTML = `<i data-lucide="play" class="mr-2 w-5 h-5"></i> 播放`;
                lucide.createIcons();

                clearInterval(musicInterval);
                currentCol = 0;
                renderMusicGrid();
            }
        };

        // 清除音樂網格
        window.clearMusicGrid = function() {
            isPlaying = false;
            clearInterval(musicInterval);
            currentCol = 0;
            grid = Array(rows).fill().map(() => Array(cols).fill(false));
            
            const btn = document.getElementById('play-music-btn');
            btn.className = "px-8 py-3 rounded-full font-bold flex items-center text-white bg-green-500";
            btn.innerHTML = `<i data-lucide="play" class="mr-2 w-5 h-5"></i> 播放`;
            lucide.createIcons();

            renderMusicGrid();
        };

        // --- 導覽列切換邏輯 ---
        window.switchTab = function(tabName) {
            // 重置所有按鈕樣式
            document.querySelectorAll('nav button').forEach(btn => {
                btn.className = "flex flex-col items-center justify-center p-2 w-full text-gray-400 hover:text-red-500 transition-colors";
            });
            // 啟用當前按鈕樣式
            document.getElementById(`nav-${tabName}`).className = "flex flex-col items-center justify-center p-2 w-full text-red-700 transition-colors";

            // 隱藏所有分頁
            document.getElementById('tab-intro').classList.add('hidden-tab');
            document.getElementById('tab-media').classList.add('hidden-tab');
            document.getElementById('tab-master').classList.add('hidden-tab');

            // 顯示當前分頁並確保觸發重繪（如有需要）
            document.getElementById(`tab-${tabName}`).classList.remove('hidden-tab');

            // 初始化特定分頁內容 (避免影音或遊戲一開始就在背景亂跑)
            if (tabName === 'media') {
                renderMedia();
            }
        };

        // 達人頁面的子分頁切換
        window.switchMasterSubTab = function(subName) {
            // 樣式切換
            const quizBtn = document.getElementById('subtab-quiz-btn');
            const gameBtn = document.getElementById('subtab-game-btn');
            
            if (subName === 'quiz') {
                quizBtn.className = "flex-1 py-3 text-sm font-bold border-b-2 border-red-600 text-red-600 transition-colors";
                gameBtn.className = "flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-gray-500 transition-colors";
                document.getElementById('subtab-quiz').classList.remove('hidden-tab');
                document.getElementById('subtab-game').classList.add('hidden-tab');
            } else {
                gameBtn.className = "flex-1 py-3 text-sm font-bold border-b-2 border-red-600 text-red-600 transition-colors";
                quizBtn.className = "flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-gray-500 transition-colors";
                document.getElementById('subtab-game').classList.remove('hidden-tab');
                document.getElementById('subtab-quiz').classList.add('hidden-tab');
            }
        };

        // --- 初始化應用程式 ---
        window.onload = () => {
            initIntro();
            renderQuiz();
            renderMusicGrid();
            switchTab('intro'); // 預設顯示首頁
        };

    </script>
</body>
</html>
