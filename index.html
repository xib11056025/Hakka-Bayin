  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const Info = (p) => <Icon name="fa-circle-info" {...p} />;
    const Upload = (p) => <Icon name="fa-upload" {...p} />;
    const Square = (p) => <Icon name="fa-square" {...p} />;

    const Wind = (p) => <Icon name="fa-wind" {...p} />;

    // --- 五聲音階設定 ---
    const PENTATONIC_SCALE = [
      { label: '高Do', freq: 523.25 }, // C5
      { label: 'La', freq: 440.00 },   // A4
      { label: 'Sol', freq: 392.00 },  // G4
      { label: 'Mi', freq: 329.63 },   // E4
      { label: 'Re', freq: 293.66 },   // D4
      { label: 'Do', freq: 261.63 }    // C4
    ];

    // --- Web Audio API 樂器音效引擎 ---
    const AudioEngine = {
      ctx: null,
      customBuffers: {}, 
      customBaseFreqs: {}, 
      customSlices: {}, 
      
      // 混音總線與效果器
      masterGain: null,
      reverbNode: null,
      dryGain: null,
      wetGain: null,
      panners: {},

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          
          // 建立混音總線
          this.masterGain = this.ctx.createGain();
          this.dryGain = this.ctx.createGain();
          this.wetGain = this.ctx.createGain();
          
          // 建立空間殘響
          this.reverbNode = this.ctx.createConvolver();
          this.reverbNode.buffer = this.createReverbBuffer(this.ctx, 2.5, 3.0); 

          // 路由
          this.masterGain.connect(this.dryGain);
          this.masterGain.connect(this.reverbNode);
          this.reverbNode.connect(this.wetGain);
          
          this.dryGain.connect(this.ctx.destination);
          this.wetGain.connect(this.ctx.destination);

          // 預設效果比例
          this.wetGain.gain.value = 0.3; 
          this.dryGain.gain.value = 0.8; 
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },

      setReverbLevel(level) {
        if (this.wetGain) this.wetGain.gain.value = level;
      },

      createReverbBuffer(ctx, length = 2, decay = 2) {
        const sampleRate = ctx.sampleRate;
        const lengthFrames = sampleRate * length;
        const impulse = ctx.createBuffer(2, lengthFrames, sampleRate);
        for (let i = 0; i < 2; i++) {
          const channel = impulse.getChannelData(i);
          for (let j = 0; j < lengthFrames; j++) {
            channel[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / lengthFrames, decay);
          }
        }
        return impulse;
      },

      getPanner(trackId, panValue) {
        if (!this.panners[trackId]) {
          const panner = this.ctx.createStereoPanner();
          panner.pan.value = panValue;
          panner.connect(this.masterGain); 
          this.panners[trackId] = panner;
        }
        return this.panners[trackId];
      },

      autoCorrelate(buffer, sampleRate) {
        const SIZE = Math.min(buffer.length, 8192); 
        let rms = 0;
        for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
        rms = Math.sqrt(rms / SIZE);
        if (rms < 0.01) return -1; 

        let r1 = 0, r2 = SIZE - 1, thres = 0.2;
        for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
        for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buffer[SIZE - i]) < thres) { r2 = SIZE - i; break; }
        
        const buf = buffer.slice(r1, r2);
        const newSize = buf.length;

        let c = new Array(newSize).fill(0);
        for (let i = 0; i < newSize; i++) {
          for (let j = 0; j < newSize - i; j++) c[i] += buf[j] * buf[j + i];
        }
        let d = 0;
        while (c[d] > c[d + 1]) d++;
        let maxval = -1, maxpos = -1;
        for (let i = d; i < newSize; i++) {
          if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
        }
        let T0 = maxpos;
        return sampleRate / T0;
      },

      async loadSmartSampleFromUrl(trackId, url, isMelodic) {
        this.init();
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
        
        if (!this.customSlices[trackId]) this.customSlices[trackId] = {};
        let notesExtracted = [];

        const data = audioBuffer.getChannelData(0);
        const sampleRate = audioBuffer.sampleRate;

        let maxAmplitude = 0;
        for (let i = 0; i < data.length; i++) {
          const absVal = Math.abs(data[i]);
          if (absVal > maxAmplitude) maxAmplitude = absVal;
        }

        if (!isMelodic) {
          let peakIndex = 0;
          for (let i = 0; i < data.length; i++) {
            if (Math.abs(data[i]) >= maxAmplitude * 0.99) { peakIndex = i; break; }
          }
          let startIdx = peakIndex;
          while (startIdx > 0 && Math.abs(data[startIdx]) > maxAmplitude * 0.05) startIdx--;
          startIdx = Math.max(0, startIdx - Math.floor(sampleRate * 0.02));

          const cleanBuffer = this.ctx.createBuffer(audioBuffer.numberOfChannels, data.length - startIdx, sampleRate);
          for (let c = 0; c < audioBuffer.numberOfChannels; c++) {
            cleanBuffer.copyToChannel(audioBuffer.getChannelData(c).slice(startIdx), c);
          }
          this.customBuffers[trackId] = cleanBuffer;
          return { extracted: ['原音入庫'] };
        }

        const windowSize = Math.floor(sampleRate * 0.05); 
        let isPlaying = false;
        let segments = [];
        let currentStart = 0;
        const threshold = maxAmplitude * 0.15; 

        for (let i = 0; i < data.length; i += windowSize) {
          let sum = 0;
          for (let j = 0; j < windowSize && i + j < data.length; j++) sum += data[i + j] * data[i + j];
          let rms = Math.sqrt(sum / windowSize);

          if (rms > threshold && !isPlaying) {
            isPlaying = true;
            currentStart = i;
          } else if (rms < threshold / 2 && isPlaying) {
            isPlaying = false;
            if (i - currentStart > sampleRate * 0.15) segments.push({ start: currentStart, end: i });
          }
        }
        if (isPlaying && data.length - currentStart > sampleRate * 0.15) {
          segments.push({ start: currentStart, end: data.length });
        }
        if (segments.length === 0) segments = [{ start: 0, end: data.length }];

        segments.forEach(seg => {
          const sliceData = data.slice(seg.start, seg.end);
          const freq = this.autoCorrelate(sliceData, sampleRate);
          
          if (freq > 50 && freq < 3000) {
            let closestIdx = -1;
            let minDiff = Infinity;
            PENTATONIC_SCALE.forEach((note, idx) => {
              const diff = Math.abs(Math.log2(freq / note.freq));
              if (diff < minDiff) { minDiff = diff; closestIdx = idx; }
            });
            if (minDiff < 5/12) {
              const length = seg.end - seg.start;
              const newBuffer = this.ctx.createBuffer(audioBuffer.numberOfChannels, length, sampleRate);
              for (let c = 0; c < audioBuffer.numberOfChannels; c++) {
                newBuffer.copyToChannel(audioBuffer.getChannelData(c).slice(seg.start, seg.end), c);
              }
              this.customSlices[trackId][closestIdx] = newBuffer;
              const label = PENTATONIC_SCALE[closestIdx].label;
              if (!notesExtracted.includes(label)) notesExtracted.push(label);
            }
          }
        });

        const firstSegmentLength = segments[0].end - segments[0].start;
        const cleanFallbackBuffer = this.ctx.createBuffer(audioBuffer.numberOfChannels, firstSegmentLength, sampleRate);
        for (let c = 0; c < audioBuffer.numberOfChannels; c++) {
          cleanFallbackBuffer.copyToChannel(audioBuffer.getChannelData(c).slice(segments[0].start, segments[0].end), c);
        }
        this.customBuffers[trackId] = cleanFallbackBuffer;
        this.customBaseFreqs[trackId] = this.autoCorrelate(data.slice(segments[0].start, segments[0].end), sampleRate) || 261.63;

        return { extracted: notesExtracted.length > 0 ? notesExtracted : ['單音 (已變速)'] };
      },

      playRealSample(trackId, targetFreq, isMelodic, duration = 1.0, pan = 0, velocity = 1.0, startTimeOffset = 0) {
        if (!this.ctx) return;
        let bufferToPlay = null;
        let playbackRate = 1;

        if (isMelodic && targetFreq) {
          const noteIndex = PENTATONIC_SCALE.findIndex(n => n.freq === targetFreq);
          if (this.customSlices[trackId] && this.customSlices[trackId][noteIndex]) {
            bufferToPlay = this.customSlices[trackId][noteIndex];
            playbackRate = 1; 
          } else if (this.customBuffers[trackId]) {
            bufferToPlay = this.customBuffers[trackId];
            const baseFreq = this.customBaseFreqs[trackId] || 261.63;
            playbackRate = targetFreq / baseFreq;
          }
        } else {
          bufferToPlay = this.customBuffers[trackId];
        }

        if (!bufferToPlay) return;

        const source = this.ctx.createBufferSource();
        const gainNode = this.ctx.createGain();
        const pannerNode = this.getPanner(trackId, pan);

        source.buffer = bufferToPlay;
        source.playbackRate.value = playbackRate;

        const attack = isMelodic ? 0.08 : 0.01;
        const release = isMelodic ? 0.35 : 0.15; 
        const actualStartTime = this.ctx.currentTime + startTimeOffset;

        gainNode.gain.setValueAtTime(0, actualStartTime);
        gainNode.gain.linearRampToValueAtTime(velocity, actualStartTime + attack);
        gainNode.gain.setValueAtTime(velocity, actualStartTime + Math.max(attack, duration - release));
        gainNode.gain.linearRampToValueAtTime(0.001, actualStartTime + duration + release);

        source.connect(gainNode);
        gainNode.connect(pannerNode);

        source.start(actualStartTime);
        source.stop(actualStartTime + duration + release + 0.1);
      },

      playSynth(type, freq, duration, pan, velocity, startTimeOffset) {
         if(!this.ctx) return;
         const osc = this.ctx.createOscillator();
         const gainNode = this.ctx.createGain();
         const pannerNode = this.getPanner('synth', pan);
         osc.type = type; osc.frequency.setValueAtTime(freq || 200, this.ctx.currentTime + startTimeOffset);
         const actualStartTime = this.ctx.currentTime + startTimeOffset;
         gainNode.gain.setValueAtTime(0, actualStartTime);
         gainNode.gain.linearRampToValueAtTime(velocity * 0.5, actualStartTime + 0.05);
         gainNode.gain.exponentialRampToValueAtTime(0.001, actualStartTime + duration);
         osc.connect(gainNode); gainNode.connect(pannerNode);
         osc.start(actualStartTime); osc.stop(actualStartTime + duration);
      }
    };

    const playTrack = (track, freq, dur, velocity = 1.0, timeOffset = 0) => {
      if (AudioEngine.customBuffers[track.id] || (AudioEngine.customSlices[track.id] && Object.keys(AudioEngine.customSlices[track.id]).length > 0)) {
        AudioEngine.playRealSample(track.id, freq, track.isMelodic, dur, track.pan, velocity, timeOffset);
      } else {
        AudioEngine.playSynth('sine', freq, dur, track.pan, velocity, timeOffset);
      }
    };

    const TRACKS = [
      { id: 'bigGong', name: '大鑼', isMelodic: false, pan: 0.0, color: 'bg-amber-700', activeColor: 'bg-amber-600', play: function(f,d,v,t){playTrack(this, f, d, v, t)} },
      { id: 'smallGong', name: '小鑼', isMelodic: false, pan: 0.3, color: 'bg-amber-500', activeColor: 'bg-amber-400', play: function(f,d,v,t){playTrack(this, f, d, v, t)} },
      { id: 'dingDang', name: '叮噹', isMelodic: false, pan: -0.4, color: 'bg-yellow-500', activeColor: 'bg-yellow-400', play: function(f,d,v,t){playTrack(this, f, d, v, t)} },
      { id: 'bo', name: '鈸', isMelodic: false, pan: 0.5, color: 'bg-orange-500', activeColor: 'bg-orange-400', play: function(f,d,v,t){playTrack(this, f, d, v, t)} },
      { id: 'tanggu', name: '堂鼓', isMelodic: false, pan: -0.2, color: 'bg-red-700', activeColor: 'bg-red-600', play: function(f,d,v,t){playTrack(this, f, d, v, t)} },
      { id: 'bangziLow', name: '梆子(低)', isMelodic: false, pan: -0.6, color: 'bg-stone-700', activeColor: 'bg-stone-600', play: function(f,d,v,t){playTrack(this, f, d, v, t)} },
      { id: 'bangziHigh', name: '梆子(高)', isMelodic: false, pan: -0.5, color: 'bg-stone-500', activeColor: 'bg-stone-400', play: function(f,d,v,t){playTrack(this, f, d, v, t)} },
      { id: 'recorder', name: '直笛', isMelodic: true, pan: 0.6, color: 'bg-emerald-600', activeColor: 'bg-emerald-500', play: function(f,d,v,t){playTrack(this, f, d, v, t)} },
      { id: 'panghu', name: '胖胡', isMelodic: true, pan: -0.5, color: 'bg-rose-600', activeColor: 'bg-rose-500', play: function(f,d,v,t){playTrack(this, f, d, v, t)} },
      { id: 'yehu', name: '椰胡', isMelodic: true, pan: 0.4, color: 'bg-cyan-600', activeColor: 'bg-cyan-500', play: function(f,d,v,t){playTrack(this, f, d, v, t)} },
      { id: 'suonaLow', name: '嗩吶(低)', isMelodic: true, pan: -0.3, color: 'bg-orange-600', activeColor: 'bg-orange-500', play: function(f,d,v,t){playTrack(this, f, d, v, t)} },
      { id: 'suonaHigh', name: '嗩吶(高)', isMelodic: true, pan: 0.2, color: 'bg-yellow-600', activeColor: 'bg-yellow-500', play: function(f,d,v,t){playTrack(this, f, d, v, t)} },
    ];

    const STEPS = 16;

    const DEFAULT_GRID = [
      [true, null, null, null, true, null, null, null, true, null, null, null, true, null, null, null], 
      [null, null, true, null, null, null, true, null, null, null, true, null, null, null, true, null], 
      [null, true, null, true, null, true, null, true, null, true, null, true, null, true, null, true], 
      [null, null, null, null, true, null, null, null, null, null, null, null, true, null, null, null], 
      [true, null, null, true, null, true, null, null, true, null, null, true, null, true, null, null], 
      [null, true, null, null, true, null, true, null, null, true, null, null, true, null, true, null], 
      [true, null, true, null, null, true, null, true, true, null, true, null, null, true, null, true], 
      [2, null, 3, null, 2, null, 1, null, 0, null, 1, null, 2, null, 3, null], 
      [2, 'tie', 'tie', 'tie', 2, 'tie', 'tie', 'tie', 0, 'tie', 'tie', 'tie', 2, 'tie', 'tie', 'tie'], 
      [null, 2, null, 2, null, 1, null, 1, null, 0, null, 0, null, 2, null, 2], 
      [2, null, null, null, null, null, null, null, 3, null, null, null, null, null, null, null], 
      [2, null, 3, 4, 2, null, 1, 2, 0, null, 1, 2, 2, null, 3, 4], 
    ];

    const AUDIO_FILES = {
      bigGong: './audio/大鑼.m4a',
      smallGong: './audio/小鑼.m4a',
      dingDang: './audio/叮噹.m4a',
      bo: './audio/鈸.m4a',
      tanggu: './audio/堂鼓.m4a',
      bangziLow: './audio/梆子 (低).m4a',
      bangziHigh: './audio/梆子 (高).m4a',
      recorder: './audio/直笛音階從C開始.m4a',
      panghu: './audio/胖胡音階從B開始.m4a',
      yehu: './audio/椰胡音階從C開始.m4a',
      suonaLow: './audio/嗩吶音階從G開始（低八度）.m4a',

    const instruments = [
      { id: 1, name: '嗩吶', type: '管樂', desc: '客家八音的靈魂與主奏樂器，音色高亢明亮，常擔任「頭手」帶領樂團。', img: 'https://www.hakka-portal.ntpc.gov.tw/archive/article/8/normal/part_623_4412158_94710.jpg' },
      { id: 2, name: '胖胡 (大廣弦)', type: '擦弦', desc: '音色低沉渾厚，共鳴箱較大，是八音絃索音樂中重要的伴奏樂器。', img: 'https://images.unsplash.com/photo-1621516246062-8e72750a97c9?w=500&q=80' },

      { q: "傳統客家八音演奏形式主要分為哪兩種？", options: ["吹場音樂、絃索音樂", "獨奏、合奏", "文場、武場", "山歌、採茶戲"], ans: 0 },
      { q: "下列哪一種樂器不屬於客家八音常用的樂器？", options: ["嗩吶", "胖胡 (大廣弦)", "鋼琴", "堂鼓"], ans: 2 },
      { q: "在客家人的生命禮俗中，哪個場合最常聽到客家八音？", options: ["婚喪喜慶及廟會慶典", "學校升旗典禮", "睡前搖籃曲", "流行音樂演唱會"], ans: 0 },
    ];

    const playTone = (frequency, type = 'sine') => {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = frequency;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
      osc.stop(ctx.currentTime + 0.5);
    };

    function App() {
      const [activeTab, setActiveTab] = useState('intro'); // 'intro', 'media', 'master'

      return (
        <div className="flex justify-center bg-gray-100 min-h-screen font-sans">
          <div className="w-full max-w-md bg-white shadow-xl flex flex-col h-screen overflow-hidden">
            
            {/* Header */}

              {activeTab === 'intro' && <IntroScreen />}
              {activeTab === 'media' && <MediaScreen />}
              {activeTab === 'master' && <MasterScreen />}
            </main>

            {/* Bottom Navigation */}
            <nav className="bg-white border-t border-gray-200 flex justify-around p-2 pb-6 z-20">
              <NavItem icon={<BookOpen size={24}/>} label="八音介紹" active={activeTab === 'intro'} onClick={() => setActiveTab('intro')} />
              <NavItem icon={<Video size={24}/>} label="影音欣賞" active={activeTab === 'media'} onClick={() => setActiveTab('media')} />
              <NavItem icon={<Award size={24}/>} label="八音實作" active={activeTab === 'master'} onClick={() => setActiveTab('master')} />
            </nav>
          </div>
        </div>
      );
    }

    function NavItem({ icon, label, active, onClick }) {
      return (
        <button 
          onClick={onClick}
          className={`flex flex-col items-center justify-center p-2 w-full transition-colors ${active ? 'text-red-700' : 'text-gray-400 hover:text-red-500'}`}
        >
          {icon}
          <span className="text-xs mt-1 font-medium">{label}</span>
        </button>
      );
    }

    function IntroScreen() {
      return (
        <div className="p-4 space-y-6 animate-fade-in">
          <section className="bg-white p-5 rounded-2xl shadow-sm border border-orange-100">
            <h2 className="text-xl font-bold text-red-800 mb-3 flex items-center"><Info className="mr-2" size={20}/>客家八音是什麼？</h2>
            <p className="text-gray-700 leading-relaxed text-sm">
              「八音」原指金、石、絲、竹、匏、土、革、木等八種製作樂器的材料。客家八音是客家人在長期的歷史遷徙中，吸收各地民間音樂精華，結合自身語言特色所發展出的獨特器樂合奏。
            </p>
          </section>

          <section>
            <h2 className="text-xl font-bold text-red-800 mb-4 px-1">核心樂器介紹</h2>
            <div className="grid grid-cols-2 gap-3">
              {instruments.map(inst => (
                <div key={inst.id} className="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100 flex flex-col">
                  <div className="h-28 bg-gray-200 relative">
                    <img src={inst.img} alt={inst.name} className="w-full h-full object-cover mix-blend-multiply" />
                    <span className="absolute top-2 right-2 bg-black/50 text-white text-xs px-2 py-1 rounded-full">{inst.type}</span>
                  </div>
                  <div className="p-3 flex-1 flex flex-col">
                    <h3 className="font-bold text-gray-800 mb-1 text-sm">{inst.name}</h3>
                    <p className="text-xs text-gray-500 line-clamp-3 mb-2">{inst.desc}</p>
                    <button 
                      onClick={() => playTone(inst.id * 200 + 300, 'square')} 
                      className="mt-auto pt-2 text-red-600 flex items-center text-xs font-bold hover:text-red-800 border-t border-gray-100"
                    >
                      <Play size={14} className="mr-1"/> 試聽音色
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </section>
          <Copyright />
        </div>
      );
    }

    function MediaScreen() {
      return (
        <div className="p-4 space-y-5 animate-fade-in">
          <div className="bg-red-50 p-4 rounded-xl mb-4 border border-red-100">
            <h2 className="text-lg font-bold text-red-800 mb-1">影音欣賞</h2>
            <p className="text-sm text-red-600">匯集大夥房藝術團、林作長老師等珍貴影音資料，帶您身歷其境。</p>
          </div>

          {videos.map(video => (
            <div key={video.id} className="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
              <div className="aspect-video bg-gray-900 w-full relative">
                 {video.type === 'youtube' ? (
                   <iframe 
                     className="absolute top-0 left-0 w-full h-full"
                     src={video.url} 
                     title={video.title}
                     frameBorder="0" 
                     allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                     allowFullScreen
                   ></iframe>
                 ) : null}
              </div>
              <div className="p-4 flex flex-col space-y-2">
                <h3 className="font-bold text-gray-800 text-sm">{video.title}</h3>
                <div className="flex justify-between items-center">
                  <span className="inline-block bg-gray-100 text-gray-600 text-[10px] px-2 py-1 rounded">來源: {video.source}</span>
                </div>
              </div>
            </div>
          ))}
          <Copyright />
        </div>
      );
    }

    function MasterScreen() {
      const [subTab, setSubTab] = useState('game'); // 預設開啟遊戲

      return (
        <div className="h-full flex flex-col animate-fade-in bg-stone-100">
          <div className="flex bg-white shadow-sm z-10 sticky top-0">
            <button onClick={() => setSubTab('game')} className={`flex-1 py-3 text-sm font-bold border-b-2 transition-colors ${subTab === 'game' ? 'border-red-600 text-red-600' : 'border-transparent text-gray-500'}`}>進階合奏編排</button>
            <button onClick={() => setSubTab('quiz')} className={`flex-1 py-3 text-sm font-bold border-b-2 transition-colors ${subTab === 'quiz' ? 'border-red-600 text-red-600' : 'border-transparent text-gray-500'}`}>知識小測驗</button>
          </div>

          <div className="flex-1 overflow-y-auto">
            {subTab === 'quiz' && <QuizGame />}
            {subTab === 'game' && <AdvancedMusicGame />}
          </div>
        </div>
      );
    }

    function AdvancedMusicGame() {
      const [isPlaying, setIsPlaying] = useState(false);
      const [bpm, setBpm] = useState(105);
      const [currentStep, setCurrentStep] = useState(0);
      const [selectedTool, setSelectedTool] = useState(2); 
      const [grid, setGrid] = useState(DEFAULT_GRID);
      
      const [reverbLevel, setReverbLevel] = useState(0.4); 
      const [humanize, setHumanize] = useState(true); 
      
      const [loadedTracks, setLoadedTracks] = useState({});
      const [isProcessing, setIsProcessing] = useState(false);
      
      const timerRef = useRef(null);
      const currentStepRef = useRef(0);
      const isPlayingRef = useRef(false);

      const handleUserInteraction = () => { AudioEngine.init(); };

      useEffect(() => {
        AudioEngine.setReverbLevel(reverbLevel);
      }, [reverbLevel]);

      const loadLocalAudioFiles = async () => {
        setIsProcessing(true);
        handleUserInteraction();
        
        let updatedStatus = { ...loadedTracks };

        for (const track of TRACKS) {
          try {
            const url = AUDIO_FILES[track.id];
            if (url) {
              const result = await AudioEngine.loadSmartSampleFromUrl(track.id, url, track.isMelodic);
              updatedStatus[track.id] = { loaded: true, notes: result.extracted };
            }
          } catch (err) {
            console.error(`檔案 ${track.name} 載入失敗`, err);
          }
        }
        
        setLoadedTracks(updatedStatus);
        setIsProcessing(false);
      };

      const toggleCell = (trackIndex, stepIndex) => {
        handleUserInteraction();
        const newGrid = [...grid];
        newGrid[trackIndex] = [...newGrid[trackIndex]];
        const track = TRACKS[trackIndex];
        const currentVal = newGrid[trackIndex][stepIndex];

        if (track.isMelodic) {
          if (currentVal === selectedTool) {
            newGrid[trackIndex][stepIndex] = null; 
          } else {
            newGrid[trackIndex][stepIndex] = selectedTool;
            if (selectedTool !== 'tie') {
              track.play(PENTATONIC_SCALE[selectedTool].freq, 0.5, 1.0, 0); 
            }
          }
        } else {
          if (currentVal) {
            newGrid[trackIndex][stepIndex] = null;
          } else {
            newGrid[trackIndex][stepIndex] = true;
            track.play(null, 0.5, 1.0, 0); 
          }
        }
        setGrid(newGrid);
      };

      const clearGrid = () => {
        setGrid(Array.from({ length: TRACKS.length }, () => Array(STEPS).fill(null)));
        setCurrentStep(0);
        currentStepRef.current = 0;
        if (isPlaying) togglePlay();
      };

      const loadExample = () => {
        setGrid(DEFAULT_GRID);
        setCurrentStep(0);
        currentStepRef.current = 0;
        if (isPlaying) togglePlay();
      };

      const playStep = useCallback((step) => {
        const stepDurationSec = (60000 / bpm / 4) / 1000;

        TRACKS.forEach((track, trackIndex) => {
          const cellValue = grid[trackIndex][step];
          
          if (cellValue !== null && cellValue !== 'tie') {
            let tieCount = 0;
            for (let i = 1; i < STEPS; i++) {
              if (grid[trackIndex][(step + i) % STEPS] === 'tie') { tieCount++; } else { break; }
            }
            const totalDuration = stepDurationSec * (1 + tieCount);

            const humanizeOffset = humanize ? (Math.random() * 0.03 - 0.015) : 0;
            const velocity = humanize ? (0.8 + Math.random() * 0.2) : 1.0;

            if (track.isMelodic) {
              track.play(PENTATONIC_SCALE[cellValue].freq, totalDuration, velocity, humanizeOffset);
            } else {
              track.play(null, totalDuration, velocity, humanizeOffset); 
            }
          }
        });
      }, [grid, bpm, humanize]);

      const togglePlay = () => {
        handleUserInteraction();
        if (isPlaying) {
          setIsPlaying(false);
          isPlayingRef.current = false;
          clearInterval(timerRef.current);
          setCurrentStep(0);
          currentStepRef.current = 0;
        } else {
          setIsPlaying(true);
          isPlayingRef.current = true;
          const stepDuration = (60000 / bpm) / 4;
          timerRef.current = setInterval(() => {
            playStep(currentStepRef.current);
            setCurrentStep(currentStepRef.current);
            currentStepRef.current = (currentStepRef.current + 1) % STEPS;
          }, stepDuration);
        }
      };

      useEffect(() => {
        if (isPlayingRef.current) {
          clearInterval(timerRef.current);
          const stepDuration = (60000 / bpm) / 4;
          timerRef.current = setInterval(() => {
            playStep(currentStepRef.current);
            setCurrentStep(currentStepRef.current);
            currentStepRef.current = (currentStepRef.current + 1) % STEPS;
          }, stepDuration);
        }
        return () => clearInterval(timerRef.current);
      }, [bpm, playStep]);

      return (
        <div className="p-2 pb-10 space-y-4 font-sans text-stone-800" onClick={handleUserInteraction}>
          
          {/* 區塊 1：音檔管理 */}
          <section className="bg-white p-4 rounded-xl border border-stone-200 shadow-sm relative">
            {isProcessing && (
              <div className="absolute inset-0 bg-white/80 backdrop-blur-sm z-20 flex items-center justify-center rounded-xl">
                <div className="bg-indigo-600 text-white px-4 py-2 rounded-full font-bold shadow-lg animate-pulse flex items-center gap-2 text-sm">
                  <Scissors size={16} className="animate-spin" /> 正在載入與分析本機音檔...
                </div>
              </div>
            )}
            
            <div className="flex flex-col gap-2 mb-2 border-b border-stone-100 pb-3">
              <div className="flex justify-between items-center">
                <h2 className="text-base font-bold text-indigo-900 flex items-center gap-2">
                  <FolderOpen size={16} className="text-indigo-600" /> 1. 樂器音色庫
                </h2>
                <button 
                  onClick={loadLocalAudioFiles} 
                  className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 px-3 rounded-lg shadow active:scale-95 transition-all text-xs flex items-center gap-1"
                >
                  <UploadCloud size={14} /> 讀取 ./audio 檔案
                </button>
              </div>
              <p className="text-xs text-stone-500">從伺服器 audio 資料夾自動載入對應的 .m4a 樂器音檔。</p>
            </div>

            <div className="grid grid-cols-4 gap-2">
              {TRACKS.map(track => {
                const isLoaded = loadedTracks[track.id];
                return (
                  <div key={`status-${track.id}`} className={`flex items-center justify-center gap-1 p-1.5 rounded-lg border text-[10px] font-bold ${isLoaded ? 'bg-indigo-50 border-indigo-400 text-indigo-800' : 'bg-stone-50 border-stone-200 text-stone-400'}`}>
                    {isLoaded ? <CheckCircle2 size={12} className="text-emerald-500" /> : <span className="w-3 h-3 rounded-full border border-stone-300"></span>}
                    {track.name}
                  </div>
                );
              })}
            </div>
          </section>

          {/* 區塊 2：合奏編排 (含水平滾動) */}
          <section className="bg-white p-3 rounded-xl border border-stone-200 shadow-sm">
            <div className="flex justify-between items-center mb-3">
              <h2 className="text-base font-bold text-stone-700 flex items-center gap-2">
                <Music size={16} className="text-stone-500" /> 2. 譜曲編排
              </h2>
            </div>
            
            {/* 畫筆工具列 */}
            <div className="bg-stone-50 p-2 rounded-lg border border-stone-200 mb-3 flex overflow-x-auto hide-scrollbar gap-1">
              {PENTATONIC_SCALE.map((pitch, index) => (
                <button
                  key={`pitch-${index}`}
                  onClick={() => setSelectedTool(index)}
                  className={`flex-shrink-0 px-2 py-1 rounded text-xs font-bold transition-all ${selectedTool === index ? 'bg-blue-600 text-white shadow' : 'bg-white text-stone-600 border border-stone-200'}`}
                >
                  {pitch.label}
                </button>
              ))}
              <div className="w-px h-6 bg-stone-300 mx-1 flex-shrink-0"></div>
              <button onClick={() => setSelectedTool('tie')} className={`flex-shrink-0 px-2 py-1 rounded text-xs font-bold transition-all ${selectedTool === 'tie' ? 'bg-indigo-600 text-white shadow' : 'bg-white text-indigo-700 border border-indigo-200'}`}>
                延音(—)
              </button>
            </div>

            {/* 橫向捲動的編排網格 */}
            <div className="overflow-x-auto pb-2 -mx-1 px-1 hide-scrollbar">
              <div className="min-w-[600px] space-y-1">
                {TRACKS.map((track, trackIndex) => {
                  const hasCustomSample = !!loadedTracks[track.id];
                  const trackBaseColor = hasCustomSample ? 'bg-emerald-500' : track.color;

                  return (
                    <div key={`track-${track.id}`} className="flex items-center gap-1 group">
                      <button 
                        onClick={() => track.play(track.isMelodic ? PENTATONIC_SCALE[2].freq : null, 1.0, 1.0, 0)}
                        className={`w-16 flex-shrink-0 text-center font-bold text-white text-[10px] px-1 py-1.5 rounded flex items-center justify-center gap-1 shadow-sm active:scale-95 ${trackBaseColor}`}
                      >
                        {track.name}
                      </button>
                      
                      <div className="flex-1 flex gap-0.5 bg-stone-100 p-1 rounded border border-stone-200">
                        {grid[trackIndex].map((cellValue, stepIndex) => {
                          const isActive = cellValue !== null;
                          const isTie = cellValue === 'tie';
                          const activeClasses = isTie 
                            ? `${trackBaseColor} opacity-70 shadow-inner scale-[0.98] border-transparent text-white rounded-l-none border-l-0` 
                            : `${trackBaseColor} shadow-inner scale-[0.97] border-transparent text-white`;

                          return (
                            <button
                              key={`step-${trackIndex}-${stepIndex}`}
                              onClick={() => toggleCell(trackIndex, stepIndex)}
                              className={`flex-1 h-8 rounded-sm transition-all duration-150 border flex items-center justify-center ${stepIndex % 4 === 0 && !isActive ? 'border-stone-400' : 'border-stone-200'} ${isActive ? activeClasses : `bg-white hover:bg-stone-50`} ${currentStep === stepIndex && isPlaying ? 'ring-2 ring-blue-400 z-10' : ''}`}
                            >
                              {isActive && track.isMelodic && !isTie && (
                                <span className="text-[8px] font-bold">{PENTATONIC_SCALE[cellValue].label.replace('高','')}</span>
                              )}
                              {isActive && track.isMelodic && isTie && (
                                <span className="text-[10px] font-bold opacity-75">—</span>
                              )}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </section>

          {/* 區塊 3：控制台 */}
          <section className="bg-stone-800 p-3 rounded-xl shadow-lg text-white space-y-3">
            <div className="flex items-center justify-between gap-2">
              <button
                onClick={togglePlay}
                className={`flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-bold text-white transition-all shadow-md active:scale-95 ${
                  isPlaying ? 'bg-red-500 hover:bg-red-600' : 'bg-emerald-500 hover:bg-emerald-400'
                }`}
              >
                {isPlaying ? <Square size={16} /> : <Play size={16} />}
                {isPlaying ? '停止' : '播放'}
              </button>
              
              <button onClick={loadExample} className="p-2.5 rounded-lg bg-stone-700 hover:bg-stone-600 transition-all text-stone-200 flex justify-center items-center" title="載入範例">
                <FolderOpen size={16} />
              </button>
              <button onClick={clearGrid} className="p-2.5 rounded-lg bg-stone-700 hover:bg-stone-600 transition-all text-red-400 flex justify-center items-center" title="清空">
                <Trash2 size={16} />
              </button>
            </div>

            <div className="grid grid-cols-2 gap-3 pt-2 border-t border-stone-700">
              <div className="flex flex-col gap-1">
                <label className="text-[10px] font-bold text-stone-400 flex items-center gap-1">
                  <Sliders size={12} /> 速度: {bpm}
                </label>
                <input type="range" min="60" max="160" value={bpm} onChange={(e) => setBpm(Number(e.target.value))} className="w-full h-1.5 bg-stone-700 rounded-lg appearance-none cursor-pointer accent-emerald-500" />
              </div>
              <div className="flex flex-col gap-1">
                <label className="text-[10px] font-bold text-stone-400 flex items-center gap-1">
                  <Waves size={12} /> 殘響
                </label>
                <input type="range" min="0" max="1" step="0.05" value={reverbLevel} onChange={(e) => setReverbLevel(Number(e.target.value))} className="w-full h-1.5 bg-stone-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
              </div>
            </div>
          </section>

        </div>
      );
    }

    function QuizGame() {
      const [currentQ, setCurrentQ] = useState(0);
      const [score, setScore] = useState(0);
      const [showResult, setShowResult] = useState(false);
      const [selectedOpt, setSelectedOpt] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);

      const handleAnswer = (index) => {
        if (isAnswered) return;
        setSelectedOpt(index);
        setIsAnswered(true);
        
        if (index === quizQuestions[currentQ].ans) {
          setScore(prev => prev + 10);
        }

        setTimeout(() => {
          if (currentQ < quizQuestions.length - 1) {
            setCurrentQ(prev => prev + 1);
            setSelectedOpt(null);
            setIsAnswered(false);
          } else {
            setShowResult(true);
          }
        }, 1200);
      };

      const resetQuiz = () => {
        setCurrentQ(0);
        setScore(0);
        setShowResult(false);
        setSelectedOpt(null);
        setIsAnswered(false);
      };

      if (showResult) {
        return (
          <div className="p-6 flex flex-col items-center justify-center min-h-[50vh] text-center">
            <Award size={60} className="text-yellow-500 mb-4 text-6xl" />
            <h2 className="text-3xl font-black mb-2">{score} 分</h2>
            <p className="text-gray-600 mb-6 text-sm">測驗結束！對八音有更深的認識了嗎？</p>
            <button onClick={resetQuiz} className="bg-red-600 text-white px-6 py-2 rounded-full font-bold flex items-center hover:bg-red-700 active:scale-95 transition-transform text-sm">
              <RefreshCw size={16} className="mr-2" /> 再玩一次
            </button>
          </div>
        );
      }

      const q = quizQuestions[currentQ];

      return (
        <div className="p-4">
          <div className="flex justify-between items-center mb-4 text-xs font-bold text-gray-500">
            <span>題目 {currentQ + 1} / {quizQuestions.length}</span>
            <span className="text-red-600">目前分數: {score}</span>
          </div>
          
          <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4 min-h-[80px] flex items-center">
            <h3 className="text-sm font-bold text-gray-800 leading-relaxed">{q.q}</h3>
          </div>

          <div className="space-y-2">
            {q.options.map((opt, idx) => {
              let btnClass = "w-full text-left p-3 rounded-xl border-2 text-sm font-medium transition-all flex justify-between items-center ";
              if (!isAnswered) {
                btnClass += "border-gray-200 hover:border-red-300 bg-white text-gray-700";
              } else {
                if (idx === q.ans) btnClass += "border-green-500 bg-green-50 text-green-700";
                else if (idx === selectedOpt) btnClass += "border-red-500 bg-red-50 text-red-700";
                else btnClass += "border-gray-200 bg-white opacity-50";
              }

              return (
                <button key={idx} onClick={() => handleAnswer(idx)} className={btnClass} disabled={isAnswered}>
                  <span>{opt}</span>
                  {isAnswered && idx === q.ans && <CheckCircle size={16} className="text-green-500" />}
                  {isAnswered && idx === selectedOpt && idx !== q.ans && <XCircle size={16} className="text-red-500" />}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    function Copyright() {
      return (
        <div className="mt-6 mb-2 p-3 border-t border-gray-200 text-[10px] text-gray-400 text-center leading-relaxed">
          <p className="font-bold mb-1">版權聲明</p>
          <p>本APP為教學使用，部分內容取材自公開學術網路資料，版權屬原作者所有。</p>
        </div>
      );
    }

    // 將 React App 渲染到頁面中
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>
</html>
